<style>

ointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.dark{background:#182638;color:#fff}.outline{background:#fff;border:1px solid #becad6;color:#172235}.danger{background:#fff;border:1px solid #e3a4aa;color:#a7222e}.success{background:var(--green);color:white}.message{margin-top:15px;padding:11px 13px;border-radius:9px;background:#eef6ff;color:#155b91;font-size:.9rem;white-space:pre-wrap}.message.error{background:#fff0f2;color:#9e2130}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:40;min-height:68px;background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 18px;box-shadow:0 4px 15px #0002}.mini{width:38px;height:38px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-weight:900}.brand-title{font-weight:900;margin-right:14px}.nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.nav button,.top-action{background:transparent;color:#d8e4f1;border:1px solid transparent;border-radius:8px;padding:9px 11px;font-weight:750;cursor:pointer}.nav button:hover,.nav button.active,.top-action:hover{background:#ffffff12;border-color:#ffffff16;color:#fff}.user-block{margin-left:auto;text-align:right;line-height:1.12}.user-block small{display:block;color:#9eb0c3;margin-top:4px}.gear{font-size:1.05rem}.page{max-width:1500px;margin:0 auto;padding:28px 28px 60px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.page-head h1{font-size:2rem;margin:2px 0 5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:20px}.stat{padding:18px}.stat .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.stat .value{font-size:1.75rem;font-weight:900;margin-top:7px}.panel{padding:20px;margin-bottom:18px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.panel-title h2{margin:0;font-size:1.18rem}.filters{display:grid;grid-template-columns:minmax(220px,1.8fr) repeat(3,minmax(140px,1fr));gap:10px;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.data-table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}.data-table th{position:sticky;top:0;background:#f4f7fa;text-align:left;font-size:.77rem;text-transform:uppercase;letter-spacing:.05em;color:#536176;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:11px;border-bottom:1px solid #edf1f5;vertical-align:middle}.data-table tbody tr{cursor:pointer}.data-table tbody tr:hover{background:#f6faff}.money{text-align:right;white-space:nowrap}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf3f8;font-size:.77rem;font-weight:800;white-space:nowrap}.pill.sold{background:#e6f7ef;color:#126244}.pill.listed{background:#fff4d9;color:#7b5700}.pill.stock{background:#eaf4ff;color:#105d98}.empty{padding:45px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0c1623b8;z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(100%,980px);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 100px #0005}.modal.small{width:min(100%,620px)}.modal-head{position:sticky;top:0;background:#111d2c;color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2}.modal-head h2{margin:0;font-size:1.25rem}.modal-body{padding:22px}.modal-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:10px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.section{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:15px}.section h3{margin:0 0 14px;font-size:1rem}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.detail{background:#f7f9fc;border-radius:9px;padding:12px}.detail b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}.attachment-list{display:grid;gap:8px}.attachment-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px}.attachment-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.menu{position:fixed;z-index:80;top:62px;right:88px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 15px 40px #13223830;padding:7px;min-width:220px}.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:7px;padding:10px;cursor:pointer}.menu button:hover{background:#f0f5fa}.toast{position:fixed;z-index:200;right:20px;bottom:20px;max-width:420px;background:#152335;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:0 15px 45px #0004}.toast.bad{background:#8f2630}.mobile-nav{display:none}.split-summary{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fine{font-size:.82rem;color:var(--muted)}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.login-shell{grid-template-columns:1fr}.login-brand{padding:38px 24px}.chips{display:none}.login-side{padding:18px}.topbar{padding:9px 10px}.brand-title,.nav{display:none}.user-block{margin-left:auto}.page{padding:20px 14px 85px}.page-head{display:block}.page-head .actions{margin-top:12px}.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.two-col,.three-col,.split-summary{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.mobile-nav{position:fixed;z-index:45;bottom:0;left:0;right:0;height:66px;background:#101b2a;color:#fff;display:grid;grid-template-columns:repeat(4,1fr)}.mobile-nav button{background:transparent;border:0;color:#cbd8e6;font-size:.72rem;font-weight:800}.modal-backdrop{padding:0}.modal,.modal.small{width:100%;height:100%;max-height:none;border-radius:0}.modal-head{padding-top:18px}}
</style>

<body>
<div id="app"><div class="loading">Loading Jacksons Retro Manager…</div></div>
<div id="overlay"></div><div id="toast"></div>
<script type="module">
const PROJECT_URL='https://vfrmywbelxsxgqoswemr.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_Y5tQrPxbb7N3WKJmpLR05w_H7k2KxrA';
const app=document.getElementById('app'),overlay=document.getElementById('overlay'),toastHost=document.getElementById('toast');
const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.45.4');
const supabase=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={users:[],profile:null,inventory:[],watch:[],page:'dashboard',selected:null,settingsOpen:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(v||0));
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB'):'—';
const boolText=v=>v===true?'Yes':v===false?'No':'N/A';
const isAdmin=()=>state.profile?.role==='admin';
function toast(msg,bad=false){toastHost.innerHTML=`<div class="toast ${bad?'bad':''}">${esc(msg)}</div>`;setTimeout(()=>toastHost.innerHTML='',3800)}
function errMsg(e){return e?.message||String(e)}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast(errMsg(e.reason),true)});
async function loadLoginUsers(){const {data,error}=await supabase.rpc('list_login_users');if(error)throw error;state.users=(data||[]).filter(x=>x.is_active!==false)}
function loginPage(message=''){
 const options=state.users.map(u=>`<option value="${esc(u.username)}">${esc(u.display_name||u.username)} (${esc(String(u.username).toUpperCase())})</option>`).join('');
 app.innerHTML=`<main class="login-shell"><section class="login-brand"><div class="brand-mark">JR</div><p class="eyebrow">JACKSONS RETRO</p><h1>Inventory, sales and sourcing in one place.</h1><p>Manage stock, track profit, preserve sales history and work securely from any device.</p><div class="chips"><span>Shared inventory</span><span>Sales history</span><span>Secure attachments</span></div></section><section class="login-side"><div class="card login-card"><h2>Welcome back</h2><p class="muted">Choose your account to continue.</p><form id="loginForm" class="form-grid"><label>User<select id="loginUser" class="control" required>${options}</select></label><label>Password<input id="loginPassword" class="control" type="password" autocomplete="current-password" required></label><button id="loginBtn" class="btn primary" type="submit">Sign in</button></form>${message?`<div class="message error">${esc(message)}</div>`:''}</div></section></main>`;
 document.getElementById('loginForm').onsubmit=signIn;
}
async function signIn(e){e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';const username=document.getElementById('loginUser').value;const password=document.getElementById('loginPassword').value;const selected=state.users.find(x=>String(x.username).toLowerCase()===username.toLowerCase());const email=selected?.auth_email||selected?.email||`${username.toLowerCase()}@users.jacksonsretro.local`;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){loginPage(error.message);return}await enterApp(data.user)}
async function enterApp(user){const {data,error}=await supabase.from('profiles').select('user_id,username,display_name,role,is_active').eq('user_id',user.id).single();if(error||!data?.is_active){await supabase.auth.signOut();loginPage(error?.message||'This JRM account is inactive.');return}state.profile=data;await Promise.all([loadInventory(),loadWatch()]);renderShell()}
async function loadInventory(){const {data,error}=await supabase.from('inventory_items').select('*').eq('archived',false).order('created_at',{ascending:false});if(error)throw error;state.inventory=data||[]}
async function loadWatch(){const {data,error}=await supabase.from('watch_list').select('*').order('date_added',{ascending:false}).order('game_title');if(error)throw error;state.watch=data||[]}
function renderShell(){
 app.innerHTML=`<main class="app"><header class="topbar"><div class="mini">JR</div><div class="brand-title">Jacksons Retro Manager</div><nav class="nav"><button data-nav="dashboard">Dashboard</button><button data-nav="inventory">Inventory</button><button data-nav="create">Create Item</button><button data-nav="watch">Watch List</button></nav><div class="user-block"><strong>${esc(state.profile.display_name||state.profile.username)}</strong><small>${esc(state.profile.role)}</small></div><button id="settingsBtn" class="top-action gear" title="Settings">⚙</button><button id="signOutBtn" class="top-action">Sign out</button></header><section id="page" class="page"></section><nav class="mobile-nav"><button data-nav="dashboard">Dashboard</button><button data-nav="inventory">Inventory</button><button data-nav="create">Create</button><button data-nav="watch">Watch</button></nav></main>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.getElementById('signOutBtn').onclick=signOut;document.getElementById('settingsBtn').onclick=toggleSettings;renderPage();
}
function navigate(p){if(p==='create'){openItemEditor();return}state.page=p;state.settingsOpen=false;document.getElementById('settingsMenu')?.remove();renderPage()}
function renderPage(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));if(state.page==='inventory')renderInventory();else if(state.page==='watch')renderWatch();else renderDashboard()}
function inventorySummary(){const retail=state.inventory.filter(i=>i.stock_type==='Retail');const sold=retail.filter(i=>i.status==='Sold');return{spend:retail.reduce((s,i)=>s+Number(i.total_cost||0),0),sales:sold.reduce((s,i)=>s+Number(i.sale_price||0),0),profit:sold.reduce((s,i)=>s+Number(i.profit||0),0),inStock:retail.filter(i=>['In Stock','Listed'].includes(i.status)).length,sold:sold.length}}
function renderDashboard(){const s=inventorySummary();document.getElementById('page').innerHTML=`<div class="page-head"><div><p class="eyebrow">DASHBOARD</p><h1>Welcome, ${esc(state.profile.display_name||state.profile.username)}</h1><p class="muted">A live overview of Jacksons Retro stock and sales.</p></div><div class="actions"><button class="btn primary" id="dashCreate">Create Item</button><button class="btn outline" id="dashWatch">Watch List</button></div></div><div class="stats"><div class="card stat"><div class="label">Current stock</div><div class="value">${s.inStock}</div></div><div class="card stat"><div class="label">Total spend</div><div class="value">${money(s.spend)}</div></div><div class="card stat"><div class="label">Items sold</div><div class="value">${s.sold}</div></div><div class="card stat"><div class="label">Total profit</div><div class="value">${money(s.profit)}</div></div></div><div class="split-summary"><section class="card panel"><div class="panel-title"><h2>Recent inventory</h2><button class="btn outline" id="allInventory">View all</button></div>${miniItems(state.inventory.slice(0,6))}</section><section class="card panel"><div class="panel-title"><h2>Watch List</h2><button class="btn outline" id="allWatch">View all</button></div>${state.watch.length?state.watch.slice(0,6).map(w=>`<div class="attachment-row"><div class="name"><strong>${esc(w.game_title)}</strong><div class="fine">${esc(w.platform)} · target ${money(w.target_price)}</div></div></div>`).join(''):'<div class="empty">No watch-list items yet.</div>'}</section></div>`;document.getElementById('dashCreate').onclick=()=>openItemEditor();document.getElementById('dashWatch').onclick=()=>navigate('watch');document.getElementById('allInventory').onclick=()=>navigate('inventory');document.getElementById('allWatch').onclick=()=>navigate('watch')}
function miniItems(items){return items.length?items.map(i=>`<div class="attachment-row" data-open="${esc(i.id)}"><div class="name"><strong>${esc(i.item_id)} · ${esc(i.title)}</strong><div class="fine">${esc(i.platform)} · ${esc(i.status)} · ${money(i.total_cost)}</div></div></div>`).join(''):'<div class="empty">No inventory items yet.</div>'}
function renderInventory(){const platforms=[...new Set(state.inventory.map(x=>x.platform).filter(Boolean))].sort();document.getElementById('page').innerHTML=`<div class="page-head"><div><p class="eyebrow">INVENTORY</p><h1>Inventory</h1><p class="muted">Search, filter and open any individual stock item.</p></div><div class="actions"><button id="createInventory" class="btn primary">Create Item</button><button id="refreshInventory" class="btn outline">Refresh</button></div></div><section class="card panel"><div class="filters"><input id="invSearch" class="control" placeholder="Search item ID, title, model or serial"><select id="invPlatform" class="control"><option value="">All platforms</option>${platforms.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="invStatus" class="control"><option value="">All statuses</option>${['In Stock','Listed','Sold','Returned','Keep'].map(x=>`<option>${x}</option>`).join('')}</select><select id="invType" class="control"><option value="">All stock types</option><option>Retail</option><option>Internal Only</option></select></div><div id="inventoryTable"></div></section>`;['invSearch','invPlatform','invStatus','invType'].forEach(id=>document.getElementById(id).oninput=drawInventoryTable);document.getElementById('createInventory').onclick=()=>openItemEditor();document.getElementById('refreshInventory').onclick=async()=>{await loadInventory();drawInventoryTable();toast('Inventory refreshed')};drawInventoryTable()}
function drawInventoryTable(){const q=(document.getElementById('invSearch')?.value||'').toLowerCase(),p=document.getElementById('invPlatform')?.value||'',s=document.getElementById('invStatus')?.value||'',t=document.getElementById('invType')?.value||'';const rows=state.inventory.filter(i=>(!q||[i.item_id,i.title,i.platform,i.model_number,i.serial_number].some(v=>String(v||'').toLowerCase().includes(q)))&&(!p||i.platform===p)&&(!s||i.status===s)&&(!t||i.stock_type===t));const host=document.getElementById('inventoryTable');host.innerHTML=rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Item ID</th><th>Title</th><th>Platform</th><th>Stock Type</th><th>Status</th><th class="money">Total Cost</th><th class="money">Sale Price</th><th class="money">Profit</th></tr></thead><tbody>${rows.map(i=>`<tr data-id="${esc(i.id)}"><td><strong>${esc(i.item_id)}</strong></td><td>${esc(i.title)}</td><td>${esc(i.platform)}</td><td>${esc(i.stock_type)}</td><td><span class="pill ${i.status==='Sold'?'sold':i.status==='Listed'?'listed':'stock'}">${esc(i.status)}</span></td><td class="money">${money(i.total_cost)}</td><td class="money">${i.sale_price==null?'—':money(i.sale_price)}</td><td class="money">${i.status==='Sold'?money(i.profit):'—'}</td></tr>`).join('')}</tbody></table></div><p class="fine">Showing ${rows.length} of ${state.inventory.length} items.</p>`:'<div class="empty">No inventory items match these filters.</div>';host.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openItem(r.dataset.id))}
function input(name,label,type='text',value='',extra=''){return `<label>${label}<input class="control" name="${name}" type="${type}" value="${esc(value??'')}" ${extra}></label>`}
function select(name,label,values,value='',allowBlank=false){return `<label>${label}<select class="control" name="${name}">${allowBlank?'<option value="">N/A</option>':''}${values.map(v=>`<option ${String(v)===String(value)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function openItemEditor(item=null){if(!isAdmin()){toast('This account is view only.',true);return}const i=item||{};showModal(`${item?'Edit':'Create'} Inventory Item`,`<form id="itemForm"><div class="section"><h3>Basic details</h3><div class="three-col">${input('quantity','Quantity','number',i.quantity||1,'min="1" required')}${select('stock_type','Stock type',['Retail','Internal Only'],i.stock_type||'Retail')}${input('purchase_date','Purchase date','date',(i.purchase_date||new Date().toISOString().slice(0,10)),'required')}${input('platform','Platform','text',i.platform||'','required')}${input('title','Title','text',i.title||'','required')}${select('status','Status',['In Stock','Listed','Sold','Returned','Keep'],i.status||'In Stock')}</div></div><div class="section"><h3>Identification & testing</h3><div class="three-col">${select('hardware','Hardware?',['Yes','No'],i.hardware===true?'Yes':i.hardware===false?'No':'',true)}${select('tested','Tested?',['Yes','No'],i.tested===true?'Yes':i.tested===false?'No':'',true)}${input('model_number','Model number','text',i.model_number||'')}${input('serial_number','Serial number','text',i.serial_number||'')}${input('region','Region','text',i.region||'')}${input('authenticity','Authenticity','text',i.authenticity||'')}${input('purchase_source','Purchase source','text',i.purchase_source||'')}${input('battery_status','Battery status','text',i.battery_status||'')}${select('pcb_photo','PCB photo?',['Yes','No'],i.pcb_photo===true?'Yes':i.pcb_photo===false?'No':'',true)}</div></div><div class="section"><h3>Purchase costs</h3><div class="three-col">${input('purchase_price','Purchase price','number',i.purchase_price||0,'step="0.01" min="0"')}${input('postage_in','Postage in','number',i.postage_in||0,'step="0.01" min="0"')}${input('purchase_fees','Purchase fees','number',i.purchase_fees||0,'step="0.01" min="0"')}${input('battery_cost','Battery cost','number',i.battery_cost||0,'step="0.01" min="0"')}${input('other_costs','Other costs','number',i.other_costs||0,'step="0.01" min="0"')}</div></div><div class="section"><h3>Security & notes</h3><div class="two-col">${input('hidden_mark','Hidden mark','text',i.hidden_mark||'')}${input('hidden_mark_location','Hidden mark location','text',i.hidden_mark_location||'')}</div><label style="display:grid;gap:7px;margin-top:14px;font-weight:750">Notes<textarea class="control" name="notes">${esc(i.notes||'')}</textarea></label></div></form>`,[{text:'Cancel',kind:'outline',action:closeModal},{text:item?'Save Changes':'Create Item',kind:'primary',action:()=>saveItem(item?.id)}])}
function yn(v){return v==='Yes'?true:v==='No'?false:null}function nullable(v){v=String(v||'').trim();return v||null}function num(v){return Number(v||0)}
async function saveItem(id){const f=new FormData(document.getElementById('itemForm'));const payload={quantity:Number(f.get('quantity')),stock_type:f.get('stock_type'),purchase_date:f.get('purchase_date'),platform:String(f.get('platform')).trim(),title:String(f.get('title')).trim(),status:f.get('status'),hardware:yn(f.get('hardware')),tested:yn(f.get('tested')),model_number:nullable(f.get('model_number')),serial_number:nullable(f.get('serial_number')),region:nullable(f.get('region')),authenticity:nullable(f.get('authenticity')),purchase_source:nullable(f.get('purchase_source')),purchase_price:num(f.get('purchase_price')),postage_in:num(f.get('postage_in')),purchase_fees:num(f.get('purchase_fees')),battery_cost:num(f.get('battery_cost')),other_costs:num(f.get('other_costs')),battery_status:nullable(f.get('battery_status')),pcb_photo:yn(f.get('pcb_photo')),hidden_mark:nullable(f.get('hidden_mark')),hidden_mark_location:nullable(f.get('hidden_mark_location')),notes:nullable(f.get('notes'))};if(!payload.title||!payload.platform){toast('Title and platform are required.',true);return}let result;if(id)result=await supabase.from('inventory_items').update(payload).eq('id',id).select().single();else result=await supabase.from('inventory_items').insert(payload).select().single();if(result.error){toast(result.error.message,true);return}await loadInventory();closeModal();toast(id?'Item updated':'Item created');openItem(result.data.id)}
function openItem(id){const i=state.inventory.find(x=>x.id===id);if(!i)return;state.selected=i;showModal(`${i.item_id} · ${i.title}`,`<div class="detail-grid"><div class="detail"><b>Platform</b>${esc(i.platform)}</div><div class="detail"><b>Status</b>${esc(i.status)}</div><div class="detail"><b>Stock type</b>${esc(i.stock_type)}</div><div class="detail"><b>Purchase date</b>${date(i.purchase_date)}</div><div class="detail"><b>Total cost</b>${money(i.total_cost)}</div><div class="detail"><b>Sale price</b>${i.sale_price==null?'—':money(i.sale_price)}</div><div class="detail"><b>Profit</b>${i.status==='Sold'?money(i.profit):'—'}</div><div class="detail"><b>Tested</b>${boolText(i.tested)}</div></div><div class="section" style="margin-top:16px"><h3>Identification</h3><div class="detail-grid"><div class="detail"><b>Model</b>${esc(i.model_number||'—')}</div><div class="detail"><b>Serial</b>${esc(i.serial_number||'—')}</div><div class="detail"><b>Region</b>${esc(i.region||'—')}</div><div class="detail"><b>Authenticity</b>${esc(i.authenticity||'—')}</div></div></div><div class="section"><div class="panel-title"><h3>Attachments & photos</h3><div class="actions"><button class="btn outline" id="uploadFiles">Upload</button><button class="btn outline" id="refreshFiles">Refresh</button></div></div><div id="attachmentHost"><div class="muted">Loading attachments…</div></div></div>${i.notes?`<div class="section"><h3>Notes</h3><p>${esc(i.notes)}</p></div>`:''}`,buildItemActions(i));setTimeout(()=>{document.getElementById('uploadFiles').onclick=()=>uploadAttachments(i);document.getElementById('refreshFiles').onclick=()=>loadAttachments(i);loadAttachments(i)},0)}
function buildItemActions(i){const a=[{text:'Close',kind:'outline',action:closeModal}];if(isAdmin()){a.push({text:'Edit',kind:'outline',action:()=>openItemEditor(i)});if(i.status!=='Sold')a.push({text:'Record Sale',kind:'success',action:()=>openSale(i)});a.push({text:'Archive',kind:'danger',action:()=>archiveItem(i)})}return a}
function openSale(i){showModal(`Record Sale · ${i.item_id}`,`<form id="saleForm"><div class="two-col">${input('date_sold','Date sold','date',new Date().toISOString().slice(0,10),'required')}${input('sold_via','Sold via','text',i.sold_via||'eBay')}${input('ebay_item_number','Order / listing reference','text',i.ebay_item_number||'')}${input('sale_price','Sale price','number',i.sale_price||0,'step="0.01" min="0" required')}${input('postage_charged','Postage charged','number',i.postage_charged||0,'step="0.01"')}${input('postage_out','Postage out','number',i.postage_out||0,'step="0.01"')}${input('fees','Fees','number',i.fees||0,'step="0.01"')}</div></form>`,[{text:'Cancel',kind:'outline',action:()=>openItem(i.id)},{text:'Record Sale',kind:'success',action:()=>saveSale(i.id)}])}
async function saveSale(id){const f=new FormData(document.getElementById('saleForm'));const payload={date_sold:f.get('date_sold'),sold_via:nullable(f.get('sold_via')),ebay_item_number:nullable(f.get('ebay_item_number')),sale_price:num(f.get('sale_price')),postage_charged:num(f.get('postage_charged')),postage_out:num(f.get('postage_out')),fees:num(f.get('fees')),status:'Sold'};const {data,error}=await supabase.from('inventory_items').update(payload).eq('id',id).select().single();if(error){toast(error.message,true);return}await loadInventory();closeModal();toast(`Sale recorded for ${data.item_id}`);navigate('inventory')}
async function archiveItem(i){if(!confirm(`Archive ${i.item_id}? The historical record will remain in Supabase.`))return;const {error}=await supabase.from('inventory_items').update({archived:true}).eq('id',i.id);if(error){toast(error.message,true);return}await loadInventory();closeModal();toast('Item archived');navigate('inventory')}
async function loadAttachments(i){const host=document.getElementById('attachmentHost');if(!host)return;const {data,error}=await supabase.storage.from('jrm').list(i.item_id,{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error){host.innerHTML=`<div class="message error">${esc(error.message)}</div>`;return}const files=(data||[]).filter(x=>x.name!=='.emptyFolderPlaceholder');host.innerHTML=files.length?`<div class="attachment-list">${files.map(x=>`<div class="attachment-row"><div class="name"><strong>${esc(x.name)}</strong><div class="fine">${x.metadata?.size?Math.round(x.metadata.size/1024)+' KB':''}</div></div><button class="btn outline" data-openfile="${esc(x.name)}">Open</button>${isAdmin()?`<button class="btn danger" data-deletefile="${esc(x.name)}">Delete</button>`:''}</div>`).join('')}</div>`:'<div class="empty">No attachments uploaded for this item.</div>';host.querySelectorAll('[data-openfile]').forEach(b=>b.onclick=()=>openAttachment(i,b.dataset.openfile));host.querySelectorAll('[data-deletefile]').forEach(b=>b.onclick=()=>deleteAttachment(i,b.dataset.deletefile))}
async function uploadAttachments(i){const pick=document.createElement('input');pick.type='file';pick.multiple=true;pick.accept='image/jpeg,image/png,image/webp,application/pdf';pick.onchange=async()=>{for(const file of pick.files){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${i.item_id}/${Date.now()}-${safe}`;const {error}=await supabase.storage.from('jrm').upload(path,file,{upsert:false,contentType:file.type});if(error){toast(`${file.name}: ${error.message}`,true);return}}toast('Attachments uploaded');await loadAttachments(i)};pick.click()}
async function openAttachment(i,name){const path=`${i.item_id}/${name}`;const {data,error}=await supabase.storage.from('jrm').createSignedUrl(path,60);if(error){toast(error.message,true);return}window.open(data.signedUrl,'_blank','noopener')}
async function deleteAttachment(i,name){if(!confirm(`Delete ${name}?`))return;const {error}=await supabase.storage.from('jrm').remove([`${i.item_id}/${name}`]);if(error){toast(error.message,true);return}toast('Attachment deleted');loadAttachments(i)}
function renderWatch(){const platforms=[...new Set(state.watch.map(x=>x.platform).filter(Boolean))].sort();document.getElementById('page').innerHTML=`<div class="page-head"><div><p class="eyebrow">WATCH LIST</p><h1>Watch List</h1><p class="muted">Games and hardware worth sourcing.</p></div><div class="actions">${isAdmin()?'<button id="addWatch" class="btn primary">Add Entry</button>':''}<button id="refreshWatch" class="btn outline">Refresh</button></div></div><section class="card panel"><div class="filters" style="grid-template-columns:2fr 1fr"><input id="watchSearch" class="control" placeholder="Search title, platform or notes"><select id="watchPlatform" class="control"><option value="">All platforms</option>${platforms.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="watchTable"></div></section>`;document.getElementById('watchSearch').oninput=drawWatchTable;document.getElementById('watchPlatform').oninput=drawWatchTable;document.getElementById('addWatch')?.addEventListener('click',()=>openWatchEditor());document.getElementById('refreshWatch').onclick=async()=>{await loadWatch();drawWatchTable();toast('Watch List refreshed')};drawWatchTable()}
function drawWatchTable(){const q=(document.getElementById('watchSearch')?.value||'').toLowerCase(),p=document.getElementById('watchPlatform')?.value||'';const rows=state.watch.filter(w=>(!q||[w.game_title,w.platform,w.source,w.notes].some(v=>String(v||'').toLowerCase().includes(q)))&&(!p||w.platform===p));const h=document.getElementById('watchTable');h.innerHTML=rows.length?`<div class="table-wrap"><table class="data-table" style="min-width:720px"><thead><tr><th>Platform</th><th>Title</th><th class="money">Target Price</th><th>Source</th><th>Date Added</th></tr></thead><tbody>${rows.map(w=>`<tr data-watch="${esc(w.id)}"><td>${esc(w.platform)}</td><td><strong>${esc(w.game_title)}</strong></td><td class="money">${money(w.target_price)}</td><td>${esc(w.source||'—')}</td><td>${date(w.date_added)}</td></tr>`).join('')}</tbody></table></div><p class="fine">Showing ${rows.length} of ${state.watch.length} watch-list items.</p>`:'<div class="empty">No watch-list entries match these filters.</div>';h.querySelectorAll('[data-watch]').forEach(r=>r.onclick=()=>openWatchEditor(state.watch.find(x=>x.id===r.dataset.watch)))}
function openWatchEditor(w=null){if(!isAdmin()){toast('This account is view only.',true);return}showModal(w?'Edit Watch List Entry':'Add Watch List Entry',`<form id="watchForm" class="form-grid">${input('platform','Platform','text',w?.platform||'','required')}${input('game_title','Game / item title','text',w?.game_title||'','required')}${input('target_price','Target purchase price','number',w?.target_price||0,'step="0.01" min="0"')}${input('source','Source','text',w?.source||'')}${input('date_added','Date added','date',w?.date_added||new Date().toISOString().slice(0,10))}<label>Notes<textarea class="control" name="notes">${esc(w?.notes||'')}</textarea></label></form>`,[{text:'Cancel',kind:'outline',action:closeModal},...(w?[{text:'Delete',kind:'danger',action:()=>deleteWatch(w)}]:[]),{text:w?'Save':'Add Entry',kind:'primary',action:()=>saveWatch(w?.id)}])}
async function saveWatch(id){const f=new FormData(document.getElementById('watchForm'));const p={platform:String(f.get('platform')).trim(),game_title:String(f.get('game_title')).trim(),target_price:num(f.get('target_price')),source:nullable(f.get('source')),notes:nullable(f.get('notes')),date_added:f.get('date_added')};let r=id?await supabase.from('watch_list').update(p).eq('id',id):await supabase.from('watch_list').insert(p);if(r.error){toast(r.error.message,true);return}await loadWatch();closeModal();toast(id?'Watch-list entry updated':'Watch-list entry added');navigate('watch')}
async function deleteWatch(w){if(!confirm(`Delete ${w.game_title} from the Watch List?`))return;const {error}=await supabase.from('watch_list').delete().eq('id',w.id);if(error){toast(error.message,true);return}await loadWatch();closeModal();toast('Watch-list entry deleted');navigate('watch')}
function toggleSettings(){const existing=document.getElementById('settingsMenu');if(existing){existing.remove();return}const menu=document.createElement('div');menu.id='settingsMenu';menu.className='menu';menu.innerHTML=`${isAdmin()?'<button id="manageUsers">Manage Users</button><button id="purgeAttachments">Purge old attachments</button>':''}<button id="securityInfo">Security & sign-in</button><button id="aboutJrm">About JRM Web</button>`;document.body.appendChild(menu);document.getElementById('manageUsers')?.addEventListener('click',openUsers);document.getElementById('purgeAttachments')?.addEventListener('click',openPurge);document.getElementById('securityInfo').onclick=()=>showModal('Security & sign-in','<p>Standard Supabase password sign-in is active. Authenticator and passkey enrolment will be added after the core web workflow is stable.</p>',[{text:'Close',kind:'primary',action:closeModal}]);document.getElementById('aboutJrm').onclick=()=>showModal('About JRM Web','<p><strong>JRM Web v0.2.0</strong></p><p class="muted">Connected to the existing Jacksons Retro Supabase database and private Storage bucket.</p>',[{text:'Close',kind:'primary',action:closeModal}])}
async function openUsers(){document.getElementById('settingsMenu')?.remove();const {data,error}=await supabase.from('profiles').select('*').order('display_name');if(error){toast(error.message,true);return}showModal('Manage Users',`<div class="attachment-list">${(data||[]).map(u=>`<div class="attachment-row"><div class="name"><strong>${esc(u.display_name||u.username)}</strong><div class="fine">${esc(u.username)} · ${esc(u.role)} · ${u.is_active?'Active':'Inactive'}</div></div></div>`).join('')}</div><p class="fine" style="margin-top:16px">User creation and forced password reset remain available through the existing protected manage-user Edge Function. The web controls will be added in the next administration build.</p>`,[{text:'Close',kind:'primary',action:closeModal}])}
function openPurge(){document.getElementById('settingsMenu')?.remove();showModal('Purge old attachments',`<p>This removes Storage files for items sold, returned or archived more than the selected number of days ago. Inventory and sale records remain intact.</p><div class="two-col">${select('retention','Retention period',['14','30','60','90'],'30')}<div></div></div><div id="purgePreview" class="message">Press Preview to calculate eligible items.</div>`,[{text:'Cancel',kind:'outline',action:closeModal},{text:'Preview',kind:'outline',action:previewPurge},{text:'Purge Eligible Files',kind:'danger',action:runPurge}])}
async function eligiblePurgeItems(){const days=Number(document.querySelector('[name="retention"]')?.value||30),cutoff=new Date(Date.now()-days*86400000);return state.inventory.filter(i=>['Sold','Returned'].includes(i.status)&&i.date_sold&&new Date(i.date_sold+'T00:00:00')<cutoff)}
async function previewPurge(){const items=await eligiblePurgeItems();document.getElementById('purgePreview').textContent=`${items.length} item folder(s) are eligible. Files will be counted during the purge.`}
async function runPurge(){const items=await eligiblePurgeItems();if(!items.length){toast('No eligible item attachments.',true);return}if(!confirm(`Permanently delete attachments for ${items.length} eligible item(s)?`))return;let removed=0;for(const i of items){const {data}=await supabase.storage.from('jrm').list(i.item_id,{limit:1000});const paths=(data||[]).filter(x=>x.name!=='.emptyFolderPlaceholder').map(x=>`${i.item_id}/${x.name}`);if(paths.length){const {error}=await supabase.storage.from('jrm').remove(paths);if(error){toast(`${i.item_id}: ${error.message}`,true);return}removed+=paths.length}}closeModal();toast(`Purged ${removed} attachment file(s).`)}
function showModal(title,body,buttons=[]){overlay.innerHTML=`<div class="modal-backdrop"><section class="modal"><header class="modal-head"><h2>${esc(title)}</h2><button class="top-action" id="modalX">✕</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${buttons.map((b,n)=>`<button class="btn ${b.kind||'outline'}" data-modalbtn="${n}">${esc(b.text)}</button>`).join('')}</footer></section></div>`;document.getElementById('modalX').onclick=closeModal;buttons.forEach((b,n)=>overlay.querySelector(`[data-modalbtn="${n}"]`).onclick=b.action)}
function closeModal(){overlay.innerHTML=''}
async function signOut(){await supabase.auth.signOut();state.profile=null;state.inventory=[];state.watch=[];loginPage()}
try{await loadLoginUsers();const {data:{session}}=await supabase.auth.getSession();if(session?.user)await enterApp(session.user);else loginPage()}catch(e){app.innerHTML=`<div class="loading"><div class="card login-card"><h2>JRM could not start</h2><div class="message error">${esc(errMsg(e))}</div></div></div>`}
</script>
</body>
</html>
