<body>
<div id="app"><div class="loading">Loading Jacksons Retro Manager…</div></div>
<div id="overlay"></div><div id="toast"></div>
<script type="module">
const PROJECT_URL='https://vfrmywbelxsxgqoswemr.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_Y5tQrPxbb7N3WKJmpLR05w_H7k2KxrA';
const app=document.getElementById('app'),overlay=document.getElementById('overlay'),toastHost=document.getElementById('toast');
const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.45.4');
const supabase=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={users:[],profile:null,inventory:[],watch:[],onlineUsers:[],presenceChannel:null,page:'dashboard',selected:null,settingsOpen:false,inlineEditId:null,refreshSeconds:Number(localStorage.getItem('jrmRefreshSeconds')||5),recentLimit:Number(localStorage.getItem('jrmRecentLimit')||5),watchLimit:Number(localStorage.getItem('jrmWatchLimit')||5),refreshTimer:null};
const PLATFORM_GROUPS=[
 {label:'NON-PLATFORM ITEMS',items:[['N/A','N/A — Books, Guides & Non-platform Items']]},
 {label:'NINTENDO',items:[['NES','NES'],['SNES','SNES'],['N64','Nintendo 64'],['GameCube','GameCube'],['Wii','Wii'],['Wii U','Wii U'],['Switch','Nintendo Switch'],['Game Boy','Game Boy'],['Game Boy Color','Game Boy Color'],['GBA','Game Boy Advance'],['DS','Nintendo DS'],['3DS','Nintendo 3DS']]},
 {label:'SEGA',items:[['Sega Master System','Sega Master System'],['Sega Mega Drive','Sega Mega Drive'],['Sega Saturn','Sega Saturn'],['Dreamcast','Dreamcast'],['Game Gear','Game Gear']]},
 {label:'SONY',items:[['PS1','PlayStation 1'],['PS2','PlayStation 2'],['PS3','PlayStation 3'],['PS4','PlayStation 4'],['PS5','PlayStation 5'],['PSP','PSP'],['PS Vita','PS Vita']]},
 {label:'MICROSOFT',items:[['Xbox','Xbox'],['Xbox 360','Xbox 360'],['Xbox One','Xbox One'],['Xbox Series X/S','Xbox Series X/S']]},
 {label:'COMPUTER & OTHER',items:[['PC','PC'],['Other','Other']]}
];
const PLATFORMS=PLATFORM_GROUPS.flatMap(g=>g.items.map(x=>x[0]));
const PURCHASE_SOURCES=['Vinted','eBay','CeX','Cash Converters','Charity Shop','Car Boot Sale','Facebook Marketplace','Private Seller','Trade-In','Auction','Shop / Retail','Other'];
const SALE_CHANNELS=['eBay','Vinted','CeX','Facebook Marketplace','Private Sale','Trade / Swap','Shop / In Person','Other'];
const REGIONS=['PAL / UK','PAL / Europe','NTSC-U / USA','NTSC-J / Japan','Australia','Region Free','Unknown'];
const AUTHENTICITY=['Unknown','Likely Genuine','PCB Verified Genuine','Repro / Copy','For Parts'];
const BATTERY_STATUS=['Untested','Original - Working','Original - Dead','Replaced','Not Applicable','Needs Checking'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(v||0));
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB'):'—';
const boolText=v=>v===true?'Yes':v===false?'No':'N/A';
const isAdmin=()=>state.profile?.role==='admin';
function toast(msg,bad=false){toastHost.innerHTML=`<div class="toast ${bad?'bad':''}">${esc(msg)}</div>`;setTimeout(()=>toastHost.innerHTML='',3800)}
function errMsg(e){return e?.message||String(e)}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast(errMsg(e.reason),true)});

function displayPlatform(v){return v==='SMD'?'Sega Mega Drive':(v||'—')}
function statusClass(v){if(v==='Sold')return 'out';if(v==='Listed')return 'listed';if(v==='Returned')return 'returned';if(v==='Keep')return 'keep';return 'stock'}
function setDashboardRefresh(seconds){state.refreshSeconds=Number(seconds)||5;localStorage.setItem('jrmRefreshSeconds',String(state.refreshSeconds));restartDashboardRefresh()}
function restartDashboardRefresh(){if(state.refreshTimer)clearInterval(state.refreshTimer);state.refreshTimer=setInterval(async()=>{if(state.page!=='dashboard'||overlay.innerHTML)return;try{await Promise.all([loadInventory(),loadWatch()]);renderDashboard()}catch(e){console.warn('Dashboard refresh failed',e)}},state.refreshSeconds*1000)}
function stopDashboardRefresh(){if(state.refreshTimer){clearInterval(state.refreshTimer);state.refreshTimer=null}}
async function loadLoginUsers(){const {data,error}=await supabase.rpc('list_login_users');if(error)throw error;state.users=(data||[]).filter(x=>x.is_active!==false)}
function loginPage(message=''){
 const options=state.users.map(u=>`<option value="${esc(u.username)}">${esc(u.display_name||u.username)} (${esc(String(u.username).toUpperCase())})</option>`).join('');
 app.innerHTML=`<main class="login-shell"><section class="login-brand"><img class="login-logo" src="./assets/jacksons-retro-logo.webp" alt="Jacksons Retro"><div class="brand-mark"><img src="./assets/alien-icon.png" alt=""></div><p class="eyebrow">JACKSONS RETRO MANAGER</p><h1>Inventory, sales and sourcing in one place.</h1><p>Manage stock, track profit, preserve sales history and work securely from any device.</p><div class="chips"><span>Shared inventory</span><span>Sales history</span><span>Secure attachments</span></div></section><section class="login-side"><div class="card login-card"><h2>Welcome back</h2><p class="muted">Choose your account to continue.</p><form id="loginForm" class="form-grid"><label>User<select id="loginUser" class="control" required>${options}</select></label><label>Password<input id="loginPassword" class="control" type="password" autocomplete="current-password" required></label><button id="loginBtn" class="btn primary" type="submit">Sign in</button></form>${message?`<div class="message error">${esc(message)}</div>`:''}</div></section></main>`;
 document.getElementById('loginForm').onsubmit=signIn;
}
async function signIn(e){e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';const username=document.getElementById('loginUser').value;const password=document.getElementById('loginPassword').value;const selected=state.users.find(x=>String(x.username).toLowerCase()===username.toLowerCase());const email=selected?.auth_email||selected?.email||`${username.toLowerCase()}@users.jacksonsretro.local`;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){loginPage(error.message);return}await enterApp(data.user)}
async function enterApp(user){const {data,error}=await supabase.from('profiles').select('user_id,username,display_name,role,is_active').eq('user_id',user.id).single();if(error||!data?.is_active){await supabase.auth.signOut();loginPage(error?.message||'This JRM account is inactive.');return}state.profile=data;await Promise.all([loadInventory(),loadWatch()]);renderShell();startPresence();restartDashboardRefresh()}
async function loadInventory(){const {data,error}=await supabase.from('inventory_items').select('*').eq('archived',false).order('created_at',{ascending:false});if(error)throw error;state.inventory=data||[]}
async function loadWatch(){const {data,error}=await supabase.from('watch_list').select('*').order('date_added',{ascending:false}).order('game_title');if(error)throw error;state.watch=data||[]}
function renderShell(){
 app.innerHTML=`<main class="app"><header class="topbar"><div class="mini"><img src="./assets/alien-icon.png" alt="Jacksons Retro"></div><div class="brand-title">Jacksons Retro Manager</div><nav class="nav"><button data-nav="dashboard">Dashboard</button><button data-nav="inventory">Inventory</button><button data-nav="create">Create Item</button><button data-nav="watch">Watch List</button></nav><div class="user-block"><strong>${esc(state.profile.display_name||state.profile.username)}</strong><small>${esc(state.profile.role)}</small></div><button id="settingsBtn" class="top-action gear" title="Settings">⚙</button><button id="signOutBtn" class="top-action">Sign out</button></header><section id="page" class="page"></section><nav class="mobile-nav"><button data-nav="dashboard">Dashboard</button><button data-nav="inventory">Inventory</button><button data-nav="create">Create</button><button data-nav="watch">Watch</button></nav></main>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.getElementById('signOutBtn').onclick=signOut;document.getElementById('settingsBtn').onclick=toggleSettings;renderPage();
}
function navigate(p){if(p==='create'){openItemEditor();return}state.page=p;state.settingsOpen=false;document.getElementById('settingsMenu')?.remove();renderPage()}
function renderPage(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));if(state.page==='inventory')renderInventory();else if(state.page==='watch')renderWatch();else renderDashboard()}
function inventorySummary(){const retail=state.inventory.filter(i=>i.stock_type==='Retail');const internal=state.inventory.filter(i=>i.stock_type==='Internal Only');const sold=retail.filter(i=>i.status==='Sold');const liveStatuses=['In Stock','Listed','Keep'];return{spend:retail.reduce((s,i)=>s+Number(i.total_cost||0),0),sales:sold.reduce((s,i)=>s+Number(i.sale_price||0),0),profit:sold.reduce((s,i)=>s+Number(i.profit||0),0),inStock:retail.filter(i=>['In Stock','Listed'].includes(i.status)).length,sold:sold.length,internalSpend:internal.reduce((s,i)=>s+Number(i.total_cost||0),0),internalCount:internal.length,internalCurrentCost:internal.filter(i=>liveStatuses.includes(i.status)).reduce((s,i)=>s+Number(i.total_cost||0),0)}}

function input(name,label,type='text',value='',extra=''){return `<label>${label}<input class="control" name="${name}" type="${type}" value="${esc(value??'')}" ${extra}></label>`}
function currencyInput(name,label,value=0,extra=''){return `<label>${label}<div class="currency-field"><span>£</span><input class="control" name="${name}" type="number" value="${esc(value??0)}" step="0.01" min="0" inputmode="decimal" ${extra}></div></label>`}
function select(name,label,values,value='',allowBlank=false){return `<label>${label}<select class="control" name="${name}">${allowBlank?'<option value="">N/A</option>':''}${values.map(v=>`<option ${String(v)===String(value)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function platformOptionMarkup(value='',includeAll=false,extras=[]){
 const selected=displayPlatform(value)==='—'?'':displayPlatform(value);
 const known=new Set(PLATFORMS);
 const extra=[...new Set(extras.map(displayPlatform).filter(v=>v&&v!=='—'&&!known.has(v)))];
 let html=includeAll?'<option value="">All platforms</option>':'';
 html+=PLATFORM_GROUPS.map(g=>`<optgroup label="${esc(g.label)}">${g.items.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(l)}</option>`).join('')}</optgroup>`).join('');
 if(extra.length)html+=`<optgroup label="EXISTING / OTHER">${extra.sort().map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('')}</optgroup>`;
 return html;
}
function platformSelect(name,label,value='GBA'){return `<label>${label}<select class="control" name="${name}">${platformOptionMarkup(value,false)}</select></label>`}
function purchaseTotal(form){return ['purchase_price','postage_in','purchase_fees','battery_cost','other_costs'].reduce((sum,n)=>sum+num(new FormData(form).get(n)),0)}

async function saveItem(id){const f=new FormData(document.getElementById('itemForm'));const payload={quantity:Number(f.get('quantity')),stock_type:f.get('stock_type'),purchase_date:f.get('purchase_date'),platform:String(f.get('platform')).trim(),title:String(f.get('title')).trim(),status:f.get('status'),hardware:yn(f.get('hardware')),tested:yn(f.get('tested')),model_number:nullable(f.get('model_number')),serial_number:nullable(f.get('serial_number')),region:nullable(f.get('region')),authenticity:nullable(f.get('authenticity')),purchase_source:nullable(f.get('purchase_source')),purchase_price:num(f.get('purchase_price')),postage_in:num(f.get('postage_in')),purchase_fees:num(f.get('purchase_fees')),battery_cost:num(f.get('battery_cost')),other_costs:num(f.get('other_costs')),battery_status:nullable(f.get('battery_status')),pcb_photo:yn(f.get('pcb_photo')),hidden_mark:nullable(f.get('hidden_mark')),hidden_mark_location:nullable(f.get('hidden_mark_location')),notes:nullable(f.get('notes'))};if(!payload.title||!payload.platform){toast('Title and platform are required.',true);return}let result;if(id)result=await supabase.from('inventory_items').update(payload).eq('id',id).select().single();else result=await supabase.from('inventory_items').insert(payload).select().single();if(result.error){toast(result.error.message,true);return}await loadInventory();closeModal();toast(id?'Item updated':'Item created');openItem(result.data.id)}

function buildItemActions(i){const a=[{text:'Close',kind:'outline',action:closeModal}];if(isAdmin()){a.push({text:'Edit',kind:'outline',action:()=>openItemEditor(i)});if(i.status!=='Sold')a.push({text:'Record Sale',kind:'success',action:()=>openSale(i)});a.push({text:'Archive',kind:'danger',action:()=>archiveItem(i)})}return a}
function openSale(i){showModal(`Record Sale · ${i.item_id}`,`<form id="saleForm"><div class="two-col">${input('date_sold','Date sold','date',new Date().toISOString().slice(0,10),'required')}${select('sold_via','Sold via',SALE_CHANNELS,i.sold_via||'eBay')}${input('ebay_item_number','Order / listing reference','text',i.ebay_item_number||'')}${currencyInput('sale_price','Sale price',i.sale_price||0,'required')}${currencyInput('postage_charged','Postage charged',i.postage_charged||0)}${currencyInput('postage_out','Postage out',i.postage_out||0)}${currencyInput('fees','Fees',i.fees||0)}</div></form>`,[{text:'Cancel',kind:'outline',action:()=>openItem(i.id)},{text:'Record Sale',kind:'success',action:()=>saveSale(i.id)}])}
async function saveSale(id){const f=new FormData(document.getElementById('saleForm'));const payload={date_sold:f.get('date_sold'),sold_via:nullable(f.get('sold_via')),ebay_item_number:nullable(f.get('ebay_item_number')),sale_price:num(f.get('sale_price')),postage_charged:num(f.get('postage_charged')),postage_out:num(f.get('postage_out')),fees:num(f.get('fees')),status:'Sold'};const {data,error}=await supabase.from('inventory_items').update(payload).eq('id',id).select().single();if(error){toast(error.message,true);return}await loadInventory();closeModal();toast(`Sale recorded for ${data.item_id}`);navigate('inventory')}
async function archiveItem(i){if(!confirm(`Archive ${i.item_id}? The historical record will remain in Supabase.`))return;const {error}=await supabase.from('inventory_items').update({archived:true}).eq('id',i.id);if(error){toast(error.message,true);return}await loadInventory();closeModal();toast('Item archived');navigate('inventory')}
async function loadAttachments(i){const host=document.getElementById('attachmentHost');if(!host)return;const {data,error}=await supabase.storage.from('jrm').list(i.item_id,{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error){host.innerHTML=`<div class="message error">${esc(error.message)}</div>`;return}const files=(data||[]).filter(x=>x.name!=='.emptyFolderPlaceholder');host.innerHTML=files.length?`<div class="attachment-list">${files.map(x=>`<div class="attachment-row"><div class="name"><strong>${esc(x.name)}</strong><div class="fine">${x.metadata?.size?Math.round(x.metadata.size/1024)+' KB':''}</div></div><button class="btn outline" data-openfile="${esc(x.name)}">Open</button>${isAdmin()?`<button class="btn danger" data-deletefile="${esc(x.name)}">Delete</button>`:''}</div>`).join('')}</div>`:'<div class="empty">No attachments uploaded for this item.</div>';host.querySelectorAll('[data-openfile]').forEach(b=>b.onclick=()=>openAttachment(i,b.dataset.openfile));host.querySelectorAll('[data-deletefile]').forEach(b=>b.onclick=()=>deleteAttachment(i,b.dataset.deletefile))}
async function uploadAttachments(i){const pick=document.createElement('input');pick.type='file';pick.multiple=true;pick.accept='image/jpeg,image/png,image/webp,application/pdf';pick.onchange=async()=>{for(const file of pick.files){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${i.item_id}/${Date.now()}-${safe}`;const {error}=await supabase.storage.from('jrm').upload(path,file,{upsert:false,contentType:file.type});if(error){toast(`${file.name}: ${error.message}`,true);return}}toast('Attachments uploaded');await loadAttachments(i)};pick.click()}
async function openAttachment(i,name){const path=`${i.item_id}/${name}`;const {data,error}=await supabase.storage.from('jrm').createSignedUrl(path,60);if(error){toast(error.message,true);return}window.open(data.signedUrl,'_blank','noopener')}
async function deleteAttachment(i,name){if(!confirm(`Delete ${name}?`))return;const {error}=await supabase.storage.from('jrm').remove([`${i.item_id}/${name}`]);if(error){toast(error.message,true);return}toast('Attachment deleted');loadAttachments(i)}
function renderWatch(){const platforms=[...new Set([...PLATFORMS,...state.watch.map(x=>x.platform).filter(Boolean)])].sort();document.getElementById('page').innerHTML=`<div class="page-head"><div><p class="eyebrow">WATCH LIST</p><h1>Watch List</h1><p class="muted">Games and hardware worth sourcing.</p></div><div class="actions">${isAdmin()?'<button id="addWatch" class="btn primary">Add Entry</button>':''}<button id="refreshWatch" class="btn outline">Refresh</button></div></div><section class="card panel"><div class="filters" style="grid-template-columns:2fr 1fr"><input id="watchSearch" class="control" placeholder="Search title, platform or notes"><select id="watchPlatform" class="control">${platformOptionMarkup('',true,platforms)}</select></div><div id="watchTable"></div></section>`;document.getElementById('watchSearch').oninput=drawWatchTable;document.getElementById('watchPlatform').oninput=drawWatchTable;document.getElementById('addWatch')?.addEventListener('click',()=>openWatchEditor());document.getElementById('refreshWatch').onclick=async()=>{await loadWatch();drawWatchTable();toast('Watch List refreshed')};drawWatchTable()}
function drawWatchTable(){const q=(document.getElementById('watchSearch')?.value||'').toLowerCase(),p=document.getElementById('watchPlatform')?.value||'';const rows=state.watch.filter(w=>(!q||[w.game_title,w.platform,w.source,w.notes].some(v=>String(v||'').toLowerCase().includes(q)))&&(!p||w.platform===p));const h=document.getElementById('watchTable');h.innerHTML=rows.length?`<div class="table-wrap"><table class="data-table" style="min-width:720px"><thead><tr><th>Platform</th><th>Title</th><th class="money">Target Price</th><th>Source</th><th>Date Added</th></tr></thead><tbody>${rows.map(w=>`<tr data-watch="${esc(w.id)}"><td>${esc(displayPlatform(w.platform))}</td><td><strong>${esc(w.game_title)}</strong></td><td class="money">${money(w.target_price)}</td><td>${esc(w.source||'—')}</td><td>${date(w.date_added)}</td></tr>`).join('')}</tbody></table></div><p class="fine">Showing ${rows.length} of ${state.watch.length} watch-list items.</p>`:'<div class="empty">No watch-list entries match these filters.</div>';h.querySelectorAll('[data-watch]').forEach(r=>r.onclick=()=>openWatchEditor(state.watch.find(x=>x.id===r.dataset.watch)))}
function openWatchEditor(w=null){if(!isAdmin()){toast('This account is view only.',true);return}showModal(w?'Edit Watch List Entry':'Add Watch List Entry',`<form id="watchForm" class="form-grid">${platformSelect('platform','Platform',w?.platform||'GBA')}${input('game_title','Game / item title','text',w?.game_title||'','required')}${currencyInput('target_price','Target purchase price',w?.target_price||0)}${select('source','Source',PURCHASE_SOURCES,w?.source||'Vinted')}${input('date_added','Date added','date',w?.date_added||new Date().toISOString().slice(0,10))}<label>Notes<textarea class="control" name="notes">${esc(w?.notes||'')}</textarea></label></form>`,[{text:'Cancel',kind:'outline',action:closeModal},...(w?[{text:'Delete',kind:'danger',action:()=>deleteWatch(w)}]:[]),{text:w?'Save':'Add Entry',kind:'primary',action:()=>saveWatch(w?.id)}])}
async function saveWatch(id){const f=new FormData(document.getElementById('watchForm'));const p={platform:String(f.get('platform')).trim(),game_title:String(f.get('game_title')).trim(),target_price:num(f.get('target_price')),source:nullable(f.get('source')),notes:nullable(f.get('notes')),date_added:f.get('date_added')};let r=id?await supabase.from('watch_list').update(p).eq('id',id):await supabase.from('watch_list').insert(p);if(r.error){toast(r.error.message,true);return}await loadWatch();closeModal();toast(id?'Watch-list entry updated':'Watch-list entry added');navigate('watch')}
async function deleteWatch(w){if(!confirm(`Delete ${w.game_title} from the Watch List?`))return;const {error}=await supabase.from('watch_list').delete().eq('id',w.id);if(error){toast(error.message,true);return}await loadWatch();closeModal();toast('Watch-list entry deleted');navigate('watch')}
function toggleSettings(){const existing=document.getElementById('settingsMenu');if(existing){existing.remove();return}const menu=document.createElement('div');menu.id='settingsMenu';menu.className='menu';menu.innerHTML=`${isAdmin()?'<button id="manageUsers">Manage Users</button><button id="purgeAttachments">Purge old attachments</button>':''}<button id="securityInfo">Security & sign-in</button><button id="aboutJrm">About JRM Web</button>`;document.body.appendChild(menu);document.getElementById('manageUsers')?.addEventListener('click',openUsers);document.getElementById('purgeAttachments')?.addEventListener('click',openPurge);document.getElementById('securityInfo').onclick=()=>showModal('Security & sign-in','<p>Standard Supabase password sign-in is active. Authenticator and passkey enrolment will be added after the core web workflow is stable.</p>',[{text:'Close',kind:'primary',action:closeModal}]);document.getElementById('aboutJrm').onclick=()=>showModal('About JRM Web','<p><strong>JRM Web v0.2.6</strong></p><p class="muted">Connected to the existing Jacksons Retro Supabase database and private Storage bucket.</p>',[{text:'Close',kind:'primary',action:closeModal}])}
async function openUsers(){document.getElementById('settingsMenu')?.remove();const {data,error}=await supabase.from('profiles').select('*').order('display_name');if(error){toast(error.message,true);return}const rows=(data||[]).map(u=>`<div class="attachment-row"><div class="name"><strong>${esc(u.display_name||u.username)}</strong><div class="fine">${esc(u.username)} · ${esc(u.role==='admin'?'Administrator':'View only')} · ${u.is_active?'Active':'Inactive'}</div></div><button class="btn outline" data-reset-user="${esc(u.user_id)}" data-reset-name="${esc(u.display_name||u.username)}">Reset password</button></div>`).join('');showModal('Manage Users',`<div class="panel-title"><div><h3 style="margin:0">JRM accounts</h3><p class="fine">Create Thomas's account or reset an existing password.</p></div><button class="btn primary" id="createUserBtn">Create user</button></div><div class="attachment-list">${rows||'<div class="empty">No users found.</div>'}</div>`,[{text:'Close',kind:'primary',action:closeModal}]);setTimeout(()=>{document.getElementById('createUserBtn').onclick=openCreateUser;overlay.querySelectorAll('[data-reset-user]').forEach(b=>b.onclick=()=>openResetPassword(b.dataset.resetUser,b.dataset.resetName))},0)}
function openCreateUser(){showModal('Create JRM User',`<form id="createUserForm" class="form-grid">${input('username','Username / initials','text','','required maxlength="12" placeholder="TJ"')}${input('displayName','Display name','text','','required placeholder="Thomas Jackson"')}${select('role','Role',['viewer','admin'],'viewer')}${input('password','Temporary password','password','','required minlength="8" autocomplete="new-password"')}${input('confirmPassword','Confirm password','password','','required minlength="8" autocomplete="new-password"')}</form><p class="fine">View-only users can sign in and view records but cannot change stock.</p>`,[{text:'Cancel',kind:'outline',action:openUsers},{text:'Create user',kind:'primary',action:createUser}])}
async function createUser(){const f=new FormData(document.getElementById('createUserForm'));const password=String(f.get('password')||''),confirmPassword=String(f.get('confirmPassword')||'');if(password!==confirmPassword){toast('The passwords do not match.',true);return}if(password.length<8){toast('The password must contain at least 8 characters.',true);return}const body={action:'create_user',username:String(f.get('username')||'').trim(),displayName:String(f.get('displayName')||'').trim(),role:String(f.get('role')||'viewer'),password};const {data,error}=await supabase.functions.invoke('manage-user',{body});if(error){toast(await functionError(error),true);return}toast(`${data?.username||body.username} created`);await loadLoginUsers();openUsers()}
function openResetPassword(userId,name){showModal(`Reset password · ${name}`,`<form id="resetPasswordForm" class="form-grid">${input('password','New password','password','','required minlength="8" autocomplete="new-password"')}${input('confirmPassword','Confirm new password','password','','required minlength="8" autocomplete="new-password"')}</form><p class="fine">The user will use this password the next time they sign in.</p>`,[{text:'Cancel',kind:'outline',action:openUsers},{text:'Reset password',kind:'primary',action:()=>resetUserPassword(userId,name)}])}
async function resetUserPassword(userId,name){const f=new FormData(document.getElementById('resetPasswordForm'));const password=String(f.get('password')||''),confirmPassword=String(f.get('confirmPassword')||'');if(password!==confirmPassword){toast('The passwords do not match.',true);return}if(password.length<8){toast('The password must contain at least 8 characters.',true);return}const {error}=await supabase.functions.invoke('manage-user',{body:{action:'reset_password',userId,password}});if(error){toast(await functionError(error),true);return}toast(`Password reset for ${name}`);openUsers()}
async function functionError(error){try{const response=error?.context;if(response?.json){const body=await response.json();return body?.message||error.message}return error.message||String(error)}catch{return error.message||String(error)}}
function openPurge(){document.getElementById('settingsMenu')?.remove();showModal('Purge old attachments',`<p>This removes Storage files for items sold, returned or archived more than the selected number of days ago. Inventory and sale records remain intact.</p><div class="two-col">${select('retention','Retention period',['14','30','60','90'],'30')}<div></div></div><div id="purgePreview" class="message">Press Preview to calculate eligible items.</div>`,[{text:'Cancel',kind:'outline',action:closeModal},{text:'Preview',kind:'outline',action:previewPurge},{text:'Purge Eligible Files',kind:'danger',action:runPurge}])}
async function eligiblePurgeItems(){const days=Number(document.querySelector('[name="retention"]')?.value||30),cutoff=new Date(Date.now()-days*86400000);return state.inventory.filter(i=>['Sold','Returned'].includes(i.status)&&i.date_sold&&new Date(i.date_sold+'T00:00:00')<cutoff)}
async function previewPurge(){const items=await eligiblePurgeItems();document.getElementById('purgePreview').textContent=`${items.length} item folder(s) are eligible. Files will be counted during the purge.`}
async function runPurge(){const items=await eligiblePurgeItems();if(!items.length){toast('No eligible item attachments.',true);return}if(!confirm(`Permanently delete attachments for ${items.length} eligible item(s)?`))return;let removed=0;for(const i of items){const {data}=await supabase.storage.from('jrm').list(i.item_id,{limit:1000});const paths=(data||[]).filter(x=>x.name!=='.emptyFolderPlaceholder').map(x=>`${i.item_id}/${x.name}`);if(paths.length){const {error}=await supabase.storage.from('jrm').remove(paths);if(error){toast(`${i.item_id}: ${error.message}`,true);return}removed+=paths.length}}closeModal();toast(`Purged ${removed} attachment file(s).`)}
function startPresence(){if(state.presenceChannel)supabase.removeChannel(state.presenceChannel);const key=`${state.profile.user_id}-${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}`;const channel=supabase.channel('jrm-online-users',{config:{presence:{key}}});state.presenceChannel=channel;channel.on('presence',{event:'sync'},()=>{const raw=channel.presenceState(),seen=new Map();Object.values(raw).flat().forEach(p=>{if(p?.user_id)seen.set(p.user_id,p)});state.onlineUsers=[...seen.values()].sort((a,b)=>String(a.display_name||a.username).localeCompare(String(b.display_name||b.username)));if(state.page==='dashboard'&&document.getElementById('page'))renderDashboard()});channel.subscribe(async status=>{if(status==='SUBSCRIBED')await channel.track({user_id:state.profile.user_id,username:state.profile.username,display_name:state.profile.display_name,role:state.profile.role,online_at:new Date().toISOString()})})}
function showModal(title,body,buttons=[]){overlay.innerHTML=`<div class="modal-backdrop"><section class="modal"><header class="modal-head"><h2>${esc(title)}</h2><button class="top-action" id="modalX">✕</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${buttons.map((b,n)=>`<button class="btn ${b.kind||'outline'}" data-modalbtn="${n}">${esc(b.text)}</button>`).join('')}</footer></section></div>`;document.getElementById('modalX').onclick=closeModal;buttons.forEach((b,n)=>overlay.querySelector(`[data-modalbtn="${n}"]`).onclick=b.action)}
function closeModal(){overlay.innerHTML=''}
async function signOut(){stopDashboardRefresh();if(state.presenceChannel){try{await state.presenceChannel.untrack()}catch{}supabase.removeChannel(state.presenceChannel);state.presenceChannel=null}await supabase.auth.signOut();state.profile=null;state.inventory=[];state.watch=[];state.onlineUsers=[];loginPage()}
try{await loadLoginUsers();const {data:{session}}=await supabase.auth.getSession();if(session?.user)await enterApp(session.user);else loginPage()}catch(e){app.innerHTML=`<div class="loading"><div class="card login-card"><h2>JRM could not start</h2><div class="message error">${esc(errMsg(e))}</div></div></div>`}
</script>
</body>
</html>
